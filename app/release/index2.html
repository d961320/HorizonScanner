  <SCRIPT TYPE="text/javascript">
    function toggleSpecialFiles() {
      var checkbox = document.getElementById("toggleSpecial");
      var special = document.getElementById("specialFiles");
      localStorage.setItem("showSpecialFiles", checkbox.checked);
      special.style.display = checkbox.checked ? "block" : "none";
    }

    window.onload = function () {
      var show = localStorage.getItem("showSpecialFiles") === "true";
      var checkbox = document.getElementById("toggleSpecial");
      var special = document.getElementById("specialFiles");

      if (checkbox) checkbox.checked = show;
      if (special) special.style.display = show ? "block" : "none";
    };
  </SCRIPT>
